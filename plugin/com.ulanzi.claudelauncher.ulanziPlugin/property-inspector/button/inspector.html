<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../../libs/css/uspi.css" />
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
</head>
<body>
  <div class="uspi-wrapper">
    <form id="property-inspector">
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>Project</div>
        <select class="uspi-item-value" name="projectPath" id="projectSelect">
          <option value="" data-localize>Loading…</option>
        </select>
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>On press</div>
        <select class="uspi-item-value" name="resumeLatest" id="modeSelect">
          <option value="0">Start a new session</option>
          <option value="1">Resume this project's latest session</option>
        </select>
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label"></div>
        <div class="uspi-item-value" style="font-size:12px;opacity:.7;line-height:1.4">
          The project list is built from your recent Claude sessions
          (<code>~/.claude/projects</code>). Pressing this key opens a terminal there.
        </div>
      </div>
    </form>
  </div>

  <script>
    const ACTION = "com.ulanzi.ulanzistudio.claudelauncher.launch";
    const select = document.getElementById("projectSelect");
    let savedParam = null;

    $UD.connect(ACTION);

    function applySaved() {
      if (savedParam && select.options.length) Utils.setFormValue(savedParam, "#property-inspector");
    }

    function fillOptions(projects) {
      select.innerHTML = "";
      if (!projects.length) {
        const o = document.createElement("option");
        o.value = "";
        o.textContent = "No recent projects found";
        select.appendChild(o);
        return;
      }
      for (const p of projects) {
        const o = document.createElement("option");
        o.value = p.path || "";
        o.textContent = p.name || p.path || "(unknown)";
        select.appendChild(o);
      }
      applySaved();
    }

    function requestProjects() { $UD.sendToPlugin({ type: "getProjects" }); }

    $UD.onConnected(requestProjects);

    $UD.onAdd((message) => {
      savedParam = message.param || null;
      applySaved();
      requestProjects();
    });

    $UD.onSendToPropertyInspector((message) => {
      const data = message.param || message.payload || message.settings || {};
      if (data.type === "projects") fillOptions(data.projects || []);
    });

    document.getElementById("property-inspector").addEventListener("change", () => {
      const params = Utils.getFormValue("#property-inspector");
      $UD.sendParamFromPlugin(params);
    });
  </script>
</body>
</html>
