<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../../libs/css/uspi.css" />
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <style>
    .grp { margin: 8px 0; }
    .lbl { font-size: 12px; opacity: .8; margin-bottom: 3px; }
    .full { width: 100%; box-sizing: border-box; }
    .hint { font-size: 11px; opacity: .6; line-height: 1.45; margin: 6px 0 12px; }
    .status { font-size: 11px; opacity: .75; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="uspi-wrapper">
    <div class="grp">
      <div class="lbl" data-localize>Claude command</div>
      <input type="text" class="full" id="claudeCmd" placeholder="claude" />
    </div>
    <div class="grp">
      <div class="lbl" data-localize>Terminal</div>
      <select class="full" id="terminal">
        <option value="auto">Auto (Windows Terminal if present)</option>
        <option value="wt">Windows Terminal (wt)</option>
        <option value="powershell">PowerShell window</option>
      </select>
    </div>
    <div class="grp">
      <div class="lbl" data-localize>Max sessions on the dial</div>
      <input type="number" class="full" id="maxSessions" min="5" max="100" placeholder="30" />
    </div>
    <div class="hint">
      Rotate the dial to scroll your recent Claude sessions (newest first); press to resume the
      highlighted one in a terminal. The list comes from <code>~/.claude/projects</code>.
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    $UD.connect("com.ulanzi.ulanzistudio.claudelauncher.scroller");

    const cmdEl = document.getElementById("claudeCmd");
    const termEl = document.getElementById("terminal");
    const maxEl = document.getElementById("maxSessions");
    const statusEl = document.getElementById("status");
    let saveTimer = null;

    function collect() {
      return {
        claudeCmd: cmdEl.value.trim() || "claude",
        terminal: termEl.value || "auto",
        maxSessions: Number(maxEl.value) || 30,
      };
    }
    function save() { try { $UD.setGlobalSettings(collect()); } catch (e) {} }
    function debouncedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }

    function load(g) {
      g = g || {};
      cmdEl.value = g.claudeCmd || "";
      termEl.value = g.terminal || "auto";
      maxEl.value = g.maxSessions || "";
    }

    cmdEl.addEventListener("input", debouncedSave);
    termEl.addEventListener("change", save);
    maxEl.addEventListener("input", debouncedSave);

    $UD.onDidReceiveGlobalSettings((m) => load(m.settings || m.param || m.payload || {}));
    $UD.onSendToPropertyInspector((m) => {
      const d = m.param || m.payload || m.settings || {};
      if (d.type === "config") {
        if (!cmdEl.value) cmdEl.value = d.claudeCmd || "";
        if (termEl.value === "auto" && d.terminal) termEl.value = d.terminal;
        if (!maxEl.value && d.maxSessions) maxEl.value = d.maxSessions;
        statusEl.textContent = `Indexed ${d.sessions} sessions across ${d.projects} projects.`;
      }
    });

    setTimeout(() => { try { $UD.getGlobalSettings(); } catch (e) {} try { $UD.sendToPlugin({ type: "getConfig" }); } catch (e) {} }, 300);
  </script>
</body>
</html>
